      - psnr_after
      - reconstruction_loss_before
      - reconstruction_loss_after
      - best_reconstruction_loss
      - configs_tested
      - best_k
      - improvement_detected
      - metrics_valid
      - accepted_update_count
    artifacts_supported:
      - result.json
    known_limitations:
      - "Synthetic HSI data only"
      - "Low-dimensional pseudo-optical parameter sweep — not native lens optimization"
      - "FFT Fraunhofer PSF proxy"
    compatible_design_ids:
      - param_reduction_sweep
    compatible_backend_ids:
      - phase_to_fft_proxy
    default_timeout_sec: 120
    risk_level: low
    enabled: true

  - handler_id: backend_switch_waveoptics_coherent
    display_name: "Backend Switch — WaveOptics Coherent ASM Probe"
    design_type: probe
    task_type: native_waveoptics_codesign
    supported_execution_modes:
