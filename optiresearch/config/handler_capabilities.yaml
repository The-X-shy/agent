capability_schema_version: "0.1"

handlers:
  - handler_id: objective_redesign_simpler_metric
    display_name: "Objective Redesign (Simpler Metric — MSE-only)"
    design_type: scientific
    task_type: stable_lens_hsi_codesign
    supported_execution_modes:
      - dry_run
      - local
    actual_evidence_level: lightweight_scientific_execution
    max_claim_ceiling: lightweight_scientific_execution
    synthetic_only: true
    native_backend_required: false
    physical_backend: false
    real_data_required: false
    remote_required: false
    supports_remote: false
    requires_remote_validation: false
    remote_evidence_ceiling: ""
    local_evidence_ceiling: lightweight_scientific_execution
    metrics_supported:
      - mse_before
      - mse_after
      - psnr_before
      - psnr_after
      - reconstruction_loss_before
      - reconstruction_loss_after
      - best_reconstruction_loss
      - improvement_detected
      - metrics_valid
      - accepted_update_count
      - execution_time_sec
    artifacts_supported:
      - result.json
    known_limitations:
      - "Synthetic HSI data only — real HSI performance may differ"
      - "FFT Fraunhofer PSF proxy — not native DeepLens geometric ray-tracing"
      - "MSE-only objective — does not test multi-objective loss stability"
    compatible_design_ids:
      - objective_redesign_simpler_metric_mse_only
    compatible_backend_ids:
      - phase_to_fft_proxy
    default_timeout_sec: 120
    risk_level: low
    enabled: true

  - handler_id: param_reduction_sweep
    display_name: "Param Reduction Sweep (Lightweight)"
    design_type: scientific
    task_type: stable_lens_hsi_codesign
